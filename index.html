<!DOCTYPE html>
<html lang="pt-br">
    <meta charset="utf-8">
    <title>Sobre mim</title>

    <style>
        body {
            background-color: #f5f5f5;
            margin: 40px;
            font-family: Arial;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .titulo {
            color: #2c3e50;
            text-align: center;
        }

        .foto {
            width: 200px;
            border-radius: 50%;
            border: 3px solid #2c3e50;
            padding: 5px;
            display: block;
            margin: auto;
        }

        #nome {
            text-align: center;
            font-weight: bold;
        }
    </style>
    <body>
        <div class="container">
            <h1 class="titulo">Sobre mim</h1>
            <img class="foto"
                 src="https://github.com/markeuzebio.png"
                 alt="Foto de perfil">
            <p id="nome">Meu nome é Marcos V. Euzébio</p>
            <h2>Meus interesses</h2>
            <ul>
                <li>Programação</li>
                <li>Jogos</li>
                <li>Tocar violão</li>
                <li>Leitura</li>
                <li>Cozinhar</li>
            </ul>
        </div>
    </body>
</html>
